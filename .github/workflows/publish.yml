# Publishes the package to npm with a provenance statement on every GitHub
# release. n8n verification (from May 2026) requires provenance-published
# packages - local `npm publish` is not accepted.
#
# Auth is npm Trusted Publishing (OIDC): no tokens stored. Configure on
# npmjs.com (package settings -> Trusted Publisher -> GitHub Actions, repo
# TranscriptFetch/n8n-nodes-transcriptfetch, workflow publish.yml):
# https://docs.npmjs.com/trusted-publishers
# (Replaced the NPM_TOKEN secret 2026-08-28 after it expired and failed a
# release with a misleading E404.)
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for trusted publishing / npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted publishing needs npm 11.5.1+; the runner's bundled npm may lag.
      - run: npm install -g npm@latest
      # --ignore-scripts: n8n-workflow's transitive isolated-vm dep needs a
      # native build we don't use; only type declarations matter here.
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm publish --provenance --access public
